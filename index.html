<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/medcore.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MedCore" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#ECEFF3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F1115" media="(prefers-color-scheme: dark)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>MedCore — Anatomía 2D/3D · Atlas · MedLex · Quizzes</title>

    <meta name="description" content="MedCore: plataforma de estudio médico. Anatomía 2D y 3D interactiva, atlas visual, terminología grecolatina MedLex y quizzes de práctica. Incluye planes de estudio con UAD Medicina como plan activo." />

    <meta property="og:title" content="MedCore — Plataforma de estudio médico" />
    <meta property="og:description" content="Anatomía 2D/3D · Atlas · Terminología MedLex · Quizzes. Con planes de estudio (UAD Medicina activo)." />
    <meta property="og:url" content="https://medcore.icu" />
    <meta property="og:type" content="website" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@200;300;400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Tema antes del primer pintado (sin parpadeo): lee Ajustes → Tema del
         almacenamiento de useSettings y pone .dark en <html>. -->
    <script>
      (function () {
        var t = 'sistema';
        try { t = (JSON.parse(localStorage.getItem('medcore-settings') || '{}').state || {}).theme || 'sistema'; } catch (e) {}
        var dark = t === 'oscuro' || (t !== 'claro' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <!-- App shell: paints instantly from static HTML (FCP/LCP) before the JS
         bundle renders. React's createRoot().render() replaces it on mount.
         Uses system fonts + inline styles so it needs no CSS/JS to appear. -->
    <div id="root">
      <div class="shell">
        <div class="shell-bar"></div>
        <div class="shell-main"><p class="shell-kicker">MedCore</p><h1 class="shell-title">Cargando…</h1></div>
      </div>
      <style>
        .shell{min-height:100dvh;background:#ECEFF3;font-family:system-ui,-apple-system,sans-serif;color:#1B2029}
        .shell-bar{height:56px;background:#FBFCFD;border-bottom:1px solid #E1E5EB}
        .shell-main{max-width:56rem;margin:0 auto;padding:32px 16px}
        .shell-kicker{margin:0 0 6px;font-size:13px;color:#5F6878}
        .shell-title{margin:0;font-size:32px;font-weight:300;letter-spacing:-.02em}
        .dark .shell{background:#0F1115;color:#ECEFF4}
        .dark .shell-bar{background:#181B21;border-color:#262A32}
        .dark .shell-kicker{color:#959EAC}
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
