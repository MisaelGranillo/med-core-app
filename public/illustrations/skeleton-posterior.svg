  <path d="M108 460 Q145 442 186 450 Q200 446 214 450 Q255 442 292 460" fill="none" stroke="#d4b890" stroke-width="8" stroke-linecap="round"/>
  <path d="M108 460 Q118 500 135 530" fill="none" stroke="#d4b890" stroke-width="7" stroke-linecap="round"/>
  <path d="M292 460 Q282 500 265 530" fill="none" stroke="#d4b890" stroke-width="7" stroke-linecap="round"/>
  <!-- Tuberosidad isquiática izquierda -->
  <ellipse cx="148" cy="520" rx="18" ry="12" fill="#e8dcc8" stroke="#b8a070" stroke-width="2"/>
  <ellipse cx="252" cy="520" rx="18" ry="12" fill="#e8dcc8" stroke="#b8a070" stroke-width="2"/>
  <!-- Húmero posterior izquierdo -->
  <rect x="88" y="204" width="22" height="138" rx="11" fill="#e8dcc8" stroke="#b8a070" stroke-width="2" transform="rotate(8 99 204)"/>
  <!-- Olécranon (punta del codo) izquierdo -->
  <ellipse cx="77" cy="346" rx="12" ry="8" fill="#e8dcc8" stroke="#b8a070" stroke-width="2"/>
  <!-- Húmero posterior derecho -->
  <rect x="290" y="204" width="22" height="138" rx="11" fill="#e8dcc8" stroke="#b8a070" stroke-width="2" transform="rotate(-8 301 204)"/>
