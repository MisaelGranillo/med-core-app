  <path d="M188 208 Q162 204 135 210" fill="none" stroke="#d4b890" stroke-width="4" stroke-linecap="round"/>
  <path d="M188 225 Q162 220 135 228" fill="none" stroke="#d4b890" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M188 242 Q162 237 136 246" fill="none" stroke="#d4b890" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M188 259 Q162 254 138 264" fill="none" stroke="#d4b890" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M188 276 Q163 271 142 282" fill="none" stroke="#d4b890" stroke-width="3" stroke-linecap="round"/>
  <path d="M212 208 Q238 204 265 210" fill="none" stroke="#d4b890" stroke-width="4" stroke-linecap="round"/>
  <path d="M212 225 Q238 220 265 228" fill="none" stroke="#d4b890" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M212 242 Q238 237 264 246" fill="none" stroke="#d4b890" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M212 259 Q238 254 262 264" fill="none" stroke="#d4b890" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M212 276 Q237 271 258 282" fill="none" stroke="#d4b890" stroke-width="3" stroke-linecap="round"/>
  <!-- Columna lumbar -->
  <rect x="186" y="400" width="28" height="86" rx="7" fill="#e8dcc8" stroke="#b8a070" stroke-width="1.5"/>
  <rect x="196" y="402" width="8" height="14" rx="2" fill="#d4b890" stroke="#b8a070" stroke-width="1"/>
  <rect x="196" y="420" width="8" height="14" rx="2" fill="#d4b890" stroke="#b8a070" stroke-width="1"/>
  <rect x="196" y="438" width="8" height="14" rx="2" fill="#d4b890" stroke="#b8a070" stroke-width="1"/>
  <rect x="196" y="456" width="8" height="14" rx="2" fill="#d4b890" stroke="#b8a070" stroke-width="1"/>
  <rect x="196" y="474" width="8" height="12" rx="2" fill="#d4b890" stroke="#b8a070" stroke-width="1"/>
