  <line x1="100" y1="205" x2="100" y2="280" stroke="#b8a070" stroke-width="1.5"/>
  <!-- Acromion izquierdo -->
  <path d="M104 202 Q114 195 128 198" fill="none" stroke="#b8a070" stroke-width="5" stroke-linecap="round"/>
  <!-- Espina escapular izquierda -->
  <path d="M100 220 Q118 212 138 215" fill="none" stroke="#d4b890" stroke-width="5" stroke-linecap="round"/>
  <!-- Escápula derecha (espejo) -->
  <path d="M296 202 Q302 240 300 280 Q290 295 268 298 Q252 280 248 255 Q250 225 260 205 Z" fill="#e8dcc8" stroke="#b8a070" stroke-width="2"/>
  <line x1="300" y1="205" x2="300" y2="280" stroke="#b8a070" stroke-width="1.5"/>
  <path d="M296 202 Q286 195 272 198" fill="none" stroke="#b8a070" stroke-width="5" stroke-linecap="round"/>
  <path d="M300 220 Q282 212 262 215" fill="none" stroke="#d4b890" stroke-width="5" stroke-linecap="round"/>
  <!-- Columna torácica (prominente desde atrás) -->
  <rect x="188" y="194" width="24" height="206" rx="6" fill="#e8dcc8" stroke="#b8a070" stroke-width="1.5"/>
  <!-- Apófisis espinosas torácicas (prominentes) -->
  <rect x="196" y="196" width="8" height="12" rx="2" fill="#d4b890" stroke="#b8a070" stroke-width="1"/>
  <rect x="196" y="212" width="8" height="12" rx="2" fill="#d4b890" stroke="#b8a070" stroke-width="1"/>
  <rect x="196" y="228" width="8" height="12" rx="2" fill="#d4b890" stroke="#b8a070" stroke-width="1"/>
  <rect x="196" y="244" width="8" height="12" rx="2" fill="#d4b890" stroke="#b8a070" stroke-width="1"/>
  <rect x="196" y="260" width="8" height="12" rx="2" fill="#d4b890" stroke="#b8a070" stroke-width="1"/>
  <rect x="196" y="276" width="8" height="12" rx="2" fill="#d4b890" stroke="#b8a070" stroke-width="1"/>
  <rect x="196" y="292" width="8" height="12" rx="2" fill="#d4b890" stroke="#b8a070" stroke-width="1"/>
  <rect x="196" y="308" width="8" height="12" rx="2" fill="#d4b890" stroke="#b8a070" stroke-width="1"/>
  <rect x="196" y="324" width="8" height="12" rx="2" fill="#d4b890" stroke="#b8a070" stroke-width="1"/>
  <rect x="196" y="340" width="8" height="12" rx="2" fill="#d4b890" stroke="#b8a070" stroke-width="1"/>
  <rect x="196" y="356" width="8" height="12" rx="2" fill="#d4b890" stroke="#b8a070" stroke-width="1"/>
