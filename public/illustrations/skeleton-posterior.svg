<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 900">
  <!-- Cráneo (vista posterior) -->
  <ellipse cx="200" cy="70" rx="57" ry="60" fill="#e8dcc8" stroke="#b8a070" stroke-width="2"/>
  <!-- Protuberancia occipital externa -->
  <ellipse cx="200" cy="118" rx="22" ry="10" fill="#d4b890" stroke="#b8a070" stroke-width="1.5"/>
  <!-- Sutura lambdoidea (en V) -->
  <path d="M148 62 Q200 95 252 62" fill="none" stroke="#b8a070" stroke-width="1" stroke-dasharray="3,3"/>
  <!-- Vértebras cervicales (posteriores) -->
  <rect x="186" y="144" width="28" height="46" rx="5" fill="#e8dcc8" stroke="#b8a070" stroke-width="1.5"/>
  <!-- Apófisis espinosas cervicales -->
  <rect x="196" y="146" width="8" height="10" rx="2" fill="#d4b890" stroke="#b8a070" stroke-width="1"/>
  <rect x="196" y="158" width="8" height="10" rx="2" fill="#d4b890" stroke="#b8a070" stroke-width="1"/>
  <rect x="196" y="170" width="8" height="10" rx="2" fill="#d4b890" stroke="#b8a070" stroke-width="1"/>
  <!-- Escápulas -->
  <!-- Escápula izquierda (en la espalda izquierda) -->
  <path d="M104 202 Q98 240 100 280 Q110 295 132 298 Q148 280 152 255 Q150 225 140 205 Z" fill="#e8dcc8" stroke="#b8a070" stroke-width="2"/>
