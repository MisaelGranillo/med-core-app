  <ellipse cx="323" cy="346" rx="12" ry="8" fill="#e8dcc8" stroke="#b8a070" stroke-width="2"/>
  <!-- Radio/Cúbito posteriores izquierdo -->
  <rect x="68" y="350" width="14" height="124" rx="7" fill="#e8dcc8" stroke="#b8a070" stroke-width="1.5" transform="rotate(5 75 350)"/>
  <rect x="84" y="350" width="12" height="120" rx="6" fill="#e8dcc8" stroke="#b8a070" stroke-width="1.5" transform="rotate(4 90 350)"/>
  <!-- Radio/Cúbito derechos -->
  <rect x="318" y="350" width="14" height="124" rx="7" fill="#e8dcc8" stroke="#b8a070" stroke-width="1.5" transform="rotate(-5 325 350)"/>
  <rect x="304" y="350" width="12" height="120" rx="6" fill="#e8dcc8" stroke="#b8a070" stroke-width="1.5" transform="rotate(-4 310 350)"/>
  <!-- Fémur posterior izquierdo -->
  <rect x="140" y="530" width="32" height="172" rx="16" fill="#e8dcc8" stroke="#b8a070" stroke-width="2"/>
  <!-- Fémur posterior derecho -->
  <rect x="228" y="530" width="32" height="172" rx="16" fill="#e8dcc8" stroke="#b8a070" stroke-width="2"/>
  <!-- Tibia/Peroné posteriores izquierdo -->
  <rect x="140" y="716" width="24" height="152" rx="10" fill="#e8dcc8" stroke="#b8a070" stroke-width="2"/>
  <rect x="166" y="720" width="12" height="145" rx="6" fill="#e8dcc8" stroke="#b8a070" stroke-width="1.5"/>
  <!-- Tibia/Peroné derechos -->
  <rect x="236" y="716" width="24" height="152" rx="10" fill="#e8dcc8" stroke="#b8a070" stroke-width="2"/>
  <rect x="222" y="720" width="12" height="145" rx="6" fill="#e8dcc8" stroke="#b8a070" stroke-width="1.5"/>
  <!-- Calcáneo izquierdo (prominente desde atrás) -->
  <ellipse cx="156" cy="876" rx="26" ry="18" fill="#e8dcc8" stroke="#b8a070" stroke-width="2"/>
  <!-- Calcáneo derecho -->
  <ellipse cx="244" cy="876" rx="26" ry="18" fill="#e8dcc8" stroke="#b8a070" stroke-width="2"/>
</svg>
