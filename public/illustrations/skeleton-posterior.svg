  <path d="M186 486 Q200 478 214 486 L218 528 Q200 536 182 528 Z" fill="#e8dcc8" stroke="#b8a070" stroke-width="2"/>
  <!-- Cóccix -->
  <path d="M192 528 Q200 540 208 528 L206 545 Q200 550 194 545 Z" fill="#d4b890" stroke="#b8a070" stroke-width="1.5"/>
